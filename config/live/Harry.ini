[General]
LogFilePath=F:\004_Logs\
LoggingActive=true
Language=English
; Meaningful (unpadded) serial lengths. FRAME serial (SZID, M1X/M5X) = 19; TRIMMER serial
; (Virtual Serial, M20/M21) = 13 (a shorter, separate format). Both are normalised to these lengths
; so the DB, the part-exit lookup and image search all use the same unpadded serial.
SerialNumberLength=19
TrimmerSerialNumberLength=13

[MySQL]
Server=localhost
Database=camera_data
User=SettData
; MASKED IN THIS SNAPSHOT — the real password lives ONLY in F:\002_Configs\Harry.ini on the server.
; This is the single line in which this file differs from the live INI (see README.md).
Password=<siehe F:\002_Configs\Harry.ini>

[CSV]
; Production CSV: <CSV_BasePath>\YYYY\MM\DD\<DDMMYY_HHMMSS>_<OrderName>.csv
; NO MSA CSV any more (export removed 2026-07-28) — all MSA files live under [MSA] ReportPath
; (PDF/RAW/IMG), the numbers in msa_results. CSVMSA_Save was removed; CSV_MSAPath stays ONLY as the
; retention root that ages out the existing legacy Y:\01 tree (see [Retention] CSV_Evaluation).
CSV_BasePath=Y:\02_CSV_Merge
CSV_MSAPath=Y:\01_CSV_Evaluation
CSV_DiagnosticPath=Y:\03_CSV_ExtraResults
DataSetsPerFile=10000
CSV_Save=true
CSVDiagnostic_Save=true

[NAS]
; NAS SORTING IS OFF: no new YYYY\MM\DD day-folders appear in 01-05; existing ones are legacy stock
; (searches run recursively from the folder root and tolerate them).
; Folder roles (target concept 2026-07-28):
;   01 low-res per part  -> THE ONLY folder any part-exit image action searches (OK/NG/DE/Unknown)
;   02 collage output    -> only when Collage_Generate=true
;   03 NG full-res       -> camera only; THE PROGRAM NEVER TOUCHES IT (retention Images_NG)
;   04 diagnostic        -> camera only; THE PROGRAM NEVER TOUCHES IT (retention Images_Diagnostic)
;   05 GoldenSample/MSA  -> TRANSIT buffer: a finished MSA run MOVES its images to [MSA] ReportPath;
;                           leftovers (aborted runs, M1X production .png) are deleted after 3 days
;   06 backup            -> OK-part low-res images when NO collage is generated
LowResIndividualPath=Z:\01_Low_Resolution_Individual\Input
CollagePath=Z:\02_Low_Resolution_Collage\Input
HighResNGPath=Z:\03_High_Resolution_NG\Input
HighResDiagnosticPath=Z:\04_High_Resolution_Diagnostic\Input
HighResGoldenSamplePath=Z:\05_High_Resolution_GoldenSample\Input
; OK part: the image action depends on [Collage] Collage_Generate ONLY —
;   true  -> build the collage, then DELETE the originals
;   false -> MOVE the originals to BackupFolder\YYYY\MM\DD (copy, verify size, delete)
; NG / Unknown / DE: low-res images are DELETED without a replacement (NG evidence = full-res in 03).
; [NAS] DeletePictures was REMOVED (deprecated + ignored since 2026-07-28).
BackupFolder=Z:\06_Backup

[Retention]
; Central retention policy. Every value is DAYS; 0 = NEVER delete. One RetentionService applies all
; of these at startup + every 24 h. Master data (settings, definitions, cameras) is never touched.
Images_NG=30              ; Z:\03_High_Resolution_NG day-folders
Images_Diagnostic=30      ; Z:\04_High_Resolution_Diagnostic day-folders
Images_GoldenSample=3     ; Z:\05_… day-folders. 3, NOT 30: 05 is only a TRANSIT buffer (a finished MSA
                          ; run moves its images to [MSA] ReportPath), so nothing needs to age there.
Images_Collage=30         ; Z:\02_Low_Resolution_Collage day-folders
Images_Backup=30          ; Z:\06_Backup (part-exit backup tree)
Images_InputLeftovers=3   ; files stuck in a ...\Input folder past N days = failed-run leftovers -> delete + WARNING
                          ; MSA images are spared in 01-04, but NOT in 05 (transit buffer, see above).
                          ; A filename that does not parse is never deleted anywhere (reported instead).
Database_Production=35    ; measurements_serial(_trimmer) via DROP PARTITION + dmcserial via batch DELETE
Database_MSA=0            ; msa_measurements, msa_results -> NEVER by default (QS data)
Reports_MSA=0             ; X:\MSA_Reports dated folders -> NEVER by default (QS evidence)
CSV_Evaluation=365        ; Y:\01_CSV_Evaluation — legacy MSA-CSV tree only (no new files are written)
CSV_Merge=365             ; Y:\02_CSV_Merge (production evidence)
CSV_ExtraResults=90       ; Y:\03_CSV_ExtraResults

[Collage]
Collage_IniPath=F:\002_Configs\Collage.ini
Collage_Generate=false
; Source of the individual low-res images (also used by the part-exit image handler) and collage output.
Collage_SingleImages=Z:\01_Low_Resolution_Individual\Input
Collage_ResultImages=Z:\02_Low_Resolution_Collage\Input

[SPS]
IP=172.29.1.5
PortKeepAlive=6000
PortPartExit=6001
PortMSA_M10=6002
PortMSA_M11=6003
PortMSA_M20=6004
PortMSA_M21=6005
PortMSA_M50=6006
AutoConnect=true

[SQLSettings]
BatchSize=100
SaveIntervalSeconds=1

[MSA]
; Folder with per-module reference files MSA_<module>.json (relative to this ini)
ReferencePath=F:\002_Configs\MSA_References
ReportPath=X:\MSA_Reports
; Local fallback when ReportPath (network X:) is unreachable — must be a WRITABLE local path (never D:, that is the DVD drive)
ReportFallbackPath=F:\003_Deploy\MSA_Reports_Fallback

[Monitoring]
; Free-disk watchdog (added 2026-08-14). Checks every drive the server writes to — including MySQL's
; own tmpdir/datadir, which it asks the running server for — and logs a WARNING/ERROR before a full
; drive breaks anything. It only reports; it never deletes (that is [Retention]).
; Background: C: ran full on 2026-08-14 and MySQL's tmpdir was on C:, so only LARGE queries failed
; (errno 28) — the MSA raw-data export of two M50 runs was lost while everything small kept working.
DiskCheckIntervalMinutes=15
DiskWarnFreeGB=10         ; WARNING below this many GB free; 0 disables the watchdog
DiskCriticalFreeGB=2      ; ERROR below this (writes are about to fail)

