; ==========================================================================
;  Harry.ini  --  CUSTOMER edition for the HarryDataServer companion tools
;
;  This is a STRIPPED, rudimentary config. It contains the read-only database
;  connection plus a few optional paths. There is NO write user (SettData) and
;  NO production paths from the line (no F:, no D:, no X:/Y:/Z: mapped drives)
;  - the analysis tools only READ the camera_data database.
;
;  WHERE THIS FILE LIVES
;  ---------------------
;  Next to the tool's .exe (e.g. C:\HarryTools\HarryAnalysis\Harry.ini). No
;  particular drive is required - a PC with only C: is fine. Each tool searches,
;  in this order: the HARRY_CONFIG_DIR environment variable, a per-tool choice
;  saved via "Change config path..." (kept in %APPDATA%\<Tool>\config.json),
;  F:\002_Configs\Harry.ini (the production machine), then THIS file next to
;  the exe. So on a customer PC this file wins automatically.
;
;  ALL you have to fill in are the two <...> values in [MySQL] below.
;  Everything after that is optional - leave it as it is if unsure.
;
;  Paths may use environment variables (%USERPROFILE%, %LOCALAPPDATA%, ...) or
;  be relative, in which case they resolve against the folder of THIS file.
; ==========================================================================

[MySQL]
; Host name or IP of the MySQL server that holds camera_data (must be reachable
; from this PC). Ask your administrator; on the machine itself it is localhost.
Server=<DB_HOST_OR_IP>
Database=camera_data
; Read-only account (see readonly_user.sql). Put in the password your admin set.
GetUser=GetData
GetPassword=<READONLY_PASSWORD>

; --------------------------------------------------------------------------
;  Optional - only needed by single tools. Safe to leave untouched: a path that
;  does not exist simply disables that one feature, no tool ever crashes on it.
; --------------------------------------------------------------------------

[MSA]
; HarryLimitSample writes its reference JSON files here (one per taught part).
; Default below is a per-user folder, so it works without admin rights and on a
; PC that only has a C: drive. The tool creates the folder on first save.
ReferencePath=%USERPROFILE%\Documents\HarryTools\MSA_References

[Collage]
; HarryCollageCreator: layout file it opens on start (created/edited by the tool).
Collage_IniPath=%USERPROFILE%\Documents\HarryTools\Collage.ini
; Folder with single images to place on the canvas - set it to wherever your
; images are (a local folder or a network share). Empty = pick per dialog.
Collage_SingleImages=

[CSV]
; Pre-selected folder in the "Export CSV" dialogs of HarryAnalysis / HarryCounter.
; Empty = the dialog opens in the last used / default location.
CSV_BasePath=%USERPROFILE%\Documents\HarryTools\Export

[Scanner]
; Handheld-DMC-scanner bridge: HarryAnalysis / HarryLimitSample can receive scans
; from the HarryDataServer on the line. Only relevant INSIDE the plant network;
; off site the LED simply stays grey and manual entry works as usual.
CompanionHost=<DB_HOST_OR_IP>
CompanionPort=9000
