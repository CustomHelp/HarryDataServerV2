[General]
LogFilePath=D:\HarryDataServer\Logs\
LoggingActive=true
Language=English
; Meaningful (unpadded) length of a Serial1 serial. The camera pads Serial1 with trailing '0'; the
; SPS delivers it unpadded. Both are normalised to this length so the DB serials match at part-exit
; lookup. The FRAME serial (SZID, M1X/M5X) is 19; the TRIMMER serial (Virtual Serial, M20/M21) is a
; separate, shorter format — 13 on the live line — normalised via its own key. (See SerialNumberHelper.)
SerialNumberLength=19
TrimmerSerialNumberLength=13

[MySQL]
Server=localhost
Database=camera_data
User=SettData
Password=1234Set
; NOTE: retention moved to the central [Retention] section (below). RetentionPeriodDays is still
; read as a deprecated fallback with a WARNING if [Retention] Database_Production is absent.

[CSV]
; Production CSV is written directly into a YYYY\MM\DD structure under CSV_BasePath as
; <DDMMYY_HHMMSS>_<OrderName>.csv (rotates on order change and every DataSetsPerFile rows).
; There is NO MSA CSV any more: the per-run MSA summary CSV was removed on 2026-07-28 — all MSA
; files live under [MSA] ReportPath (PDF/RAW/IMG), the numbers in msa_results. The keys
; CSVMSA_Save (removed) and CSV_MSAPath (kept ONLY as the retention root that ages out the
; existing legacy Y:\01 tree, see [Retention] CSV_Evaluation) are no longer written to.
; CSVDiagnostic_Save enables the diagnostic dump; its output folder + rotation live in the
; [Diagnostic] section below. CSV_DiagnosticPath is the fallback when [Diagnostic] DiagnosticPath is empty.
CSV_BasePath=Y:\02_CSV_Merge
CSV_DiagnosticPath=Y:\03_CSV_Diagnostic
DataSetsPerFile=10000
CSV_Save=true
CSVDiagnostic_Save=true

[Diagnostic]
; Diagnostic telegrams (detected by the literal "Diagnostic" token, NOT the Mode_Diagnostic
; flag) are dumped raw — one row per telegram: ReceivedAt, Serial1(22), Serial2(32), then the
; "Diagnostic" word + label + all values, plain left-to-right (variable column count). Files are
; Diagnostic_<DDMMYY_HHMMSS>.csv directly in DiagnosticPath, a NEW file every MaxRows rows.
; If DiagnosticPath is empty the legacy [CSV] CSV_DiagnosticPath is reused (no duplication).
DiagnosticPath=Y:\03_CSV_Diagnostic
MaxRows=1000

[NAS]
; Keyence image filenames use the HYPHEN '-' as the field separator (controller name and image
; variable contain underscores; the serial itself contains NO separator). Binding spec, CLAUDE.md §11:
;   {Serial1 22}-{Serial2 32}-{Overall 0|1}-{Controller}-{CameraNumber}-{&ImageVariable}.bmp
;   Normal M1X/M50 : Serial1 = frame serial + '0' padding  · Serial2 = zeros
;   Normal M2X     : Serial1 = virtual (trimmer) serial    · Serial2 = zeros
;   MSA            : Serial1 = BaseID + loop + padding     · Serial2 = the DMC on the test part
; Serial2 != zeros is the MSA marker: those images are QS data and are excluded from every
; production sweep (DE purge, OK backup/delete, Input-leftover retention, collage source search).
; Deviations in the field TODAY: M20/M21 camera 1 swaps the two widths (32/22); M50_ST040_KF1
; writes its OCR images in the old V1 underscore layout. Both are parsed, both are camera-side
; open points.
; NAS SORTING IS OFF: no new YYYY\MM\DD day-folders appear in 01-05 any more; existing ones are
; legacy stock. Every search therefore runs recursively from the folder root and tolerates them.
; Z:\ IS the images share, so the folders live directly under it (01_… … 06_…) — NOT under Z:\Images.
;
; Folder roles (target concept 2026-07-28):
;   01 Low_Resolution_Individual\Input  camera writes the per-part low-res images. THE ONLY folder
;                                       any part-exit image action searches (OK/NG/DE/Unknown).
;   02 Low_Resolution_Collage\Input     collage output (when Collage_Generate=true).
;   03 High_Resolution_NG               camera writes NG full-res images. THE PROGRAM NEVER TOUCHES
;                                       IT — only retention (Images_NG, day-folders).
;   04 High_Resolution_Diagnostic       third threshold on OK parts (extra full-res image). THE
;                                       PROGRAM NEVER TOUCHES IT — only retention.
;   05 High_Resolution_GoldenSample     first threshold (GoldenSample/MSA). TRANSIT BUFFER: a finished
;                                       MSA run MOVES its images to [MSA] ReportPath; whatever is left
;                                       (aborted runs, M1X production .png) is deleted after
;                                       [Retention] Images_InputLeftovers / Images_GoldenSample days.
;   06 Backup                           target for an OK part's low-res images when NO collage is made.
LowResIndividualPath=Z:\01_Low_Resolution_Individual\Input
CollagePath=Z:\02_Low_Resolution_Collage\Input
HighResNGPath=Z:\03_High_Resolution_NG\Input
HighResDiagnosticPath=Z:\04_High_Resolution_Diagnostic\Input
HighResGoldenSamplePath=Z:\05_High_Resolution_GoldenSample\Input
; What happens to an OK part's low-res images depends on [Collage] Collage_Generate ONLY:
;   Collage_Generate=true  -> collage into Collage_ResultImages, then DELETE the originals
;   Collage_Generate=false -> MOVE the originals to BackupFolder\YYYY\MM\DD (copy, verify size, delete)
; NG / Unknown / DE parts: the low-res images are DELETED without a replacement (the NG evidence is
; the full-res image in 03). [NAS] DeletePictures was REMOVED (deprecated + ignored since 2026-07-28).
BackupFolder=Z:\06_Backup

[Retention]
; Central retention policy. Every value is a number of DAYS; 0 = NEVER delete.
; One RetentionService applies all of these at startup + every 24 h. Master data
; (settings, definitions, cameras) is never touched.
Images_NG=30              ; Z:\03_High_Resolution_NG day-folders
Images_Diagnostic=30      ; Z:\04_High_Resolution_Diagnostic day-folders
Images_GoldenSample=3     ; Z:\05_… day-folders. 3, NOT 30: 05 is only a TRANSIT buffer (a finished
                          ; MSA run moves its images to [MSA] ReportPath), so nothing needs to age there.
Images_Collage=30         ; Z:\02_Low_Resolution_Collage day-folders
Images_Backup=30          ; Z:\06_Backup (part-exit backup tree)
Images_InputLeftovers=3   ; files stuck in a ...\Input folder past N days = failed-run leftovers -> delete + WARNING
                          ; MSA images are spared in 01-04, but NOT in 05 (transit buffer, see above).
                          ; A filename that does not parse is never deleted anywhere (reported instead).
Database_Production=35    ; measurements_serial(_trimmer) via DROP PARTITION + dmcserial via batch DELETE
Database_MSA=0            ; msa_measurements, msa_results -> default NEVER (QS data; only customer/QS enables)
Reports_MSA=0             ; X:\MSA_Reports dated folders -> default NEVER (QS evidence)
CSV_Evaluation=365        ; Y:\01_CSV_Evaluation
CSV_Merge=365             ; Y:\02_CSV_Merge (production evidence -> generous)
CSV_ExtraResults=90       ; Y:\03_CSV_ExtraResults

[Collage]
; Collage.ini holds the layout; path is relative to this config folder (portable).
Collage_IniPath=Collage.ini
; Generate a collage per OK part. OFF until verified on-site (Phase 9 live test).
Collage_Generate=false
; Folder to search for the individual *.bmp images (matched by serial + KeyName). When empty the
; part-exit image handler falls back to [NAS] LowResIndividualPath.
Collage_SingleImages=Z:\01_Low_Resolution_Individual\Input
; Output folder for the finished collage JPGs (serial_Collage.jpg).
Collage_ResultImages=Z:\02_Low_Resolution_Collage\Input
; Maximum collage file size in KB (SOW §5.2.2). The composer re-encodes the JPEG at
; decreasing quality (85 → 30) until the output fits within this limit.
MaxFileSizeKB=128

[SPS]
IP=172.29.1.5
PortKeepAlive=6000
PortPartExit=6001
PortMSA_M10=6002
PortMSA_M11=6003
PortMSA_M20=6004
PortMSA_M21=6005
PortMSA_M50=6006
AutoConnect=true

[SQLSettings]
BatchSize=100
SaveIntervalSeconds=1

[Scanner]
; DMC handheld-scanner bridge. The scanner is a TCP client (fixed IP 172.29.1.100) that
; connects to this server and writes CR-terminated DMC codes.
; Port the scanner connects to. FIXED by the scanner hardware — do not change.
ScannerListenPort=9004
; Port the companion apps (HarryAnalysis, HarryLimitSample) connect to; every scan is
; rebroadcast (raw code, CR-terminated) to all connected companions.
CompanionPort=9000
; Host the companion apps dial for the rebroadcast (this server). Read by the companions.
CompanionHost=172.29.1.5
; Ring-buffer size for the Scanner tab (in-memory, cleared on restart).
MaxScanHistoryRows=100

[MSA]
; Reference (INPUT) files MSA_<module>.json — the expected pass/fail + xm definitions.
; Written by the HarryLimitSample tool, read here during a LimitSample/MSA run. Persistent;
; kept SEPARATE from ResultPath. Relative paths resolve against this config folder.
ReferencePath=MSA_References
; Result (OUTPUT) collection root. On run completion (SPS Request;<14-char BaseID>) the server
; gathers everything for the run under:
;   <ResultPath>\YYYY\MM\DD\<BaseID>\PDF\  (2 PDF reports: AllResults + FailuresOnly)
;                                   \CSV\  (the MSA measurement CSV)
;                                   \IMG\  (all run images, moved from the GoldenSample input)
; The date folder comes from the BaseID timestamp, not the current time.
ResultPath=Y:\01_MSA_Results
; Human-facing MSA outputs: the PDF reports AND the raw-data export (Minitab CSV) are written to
;   <ReportPath>\<Module>\<yyyy-MM-dd>\   e.g. X:\MSA_Reports\M50\2026-07-21\
; Absolute local, mapped-drive and UNC (\\server\share) paths are supported; relative resolves
; against this config folder. When empty, falls back to ReportFallbackPath, then ResultPath.
ReportPath=X:\MSA_Reports
; Local fallback used when ReportPath is unreachable at write time (e.g. network drive down): the
; run is still written there and a WARNING is logged — never a crash. Default when empty:
; D:\HarryDataServer\MSA_Reports
ReportFallbackPath=D:\HarryDataServer\MSA_Reports

